[project]
name = "turbozero"
version = "0.1.1"
description = "vectorized alphazero/mcts in JAX"
authors = [{ name = "jcbmrshll", email = "92640744+jcbmrshll@users.noreply.github.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.11.2",
    "optax>=0.2.8",
    "seaglass",
]

[project.optional-dependencies]
# GPU build of jax; ./install.sh adds this when it finds an NVIDIA GPU
cuda = ["jax[cuda13]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pyright]
include = ["core", "tests", "examples"]
venvPath = "."
venv = ".venv"
# the examples' scripts import their sibling modules
executionEnvironments = [
    { root = "examples/othello", extraPaths = ["examples/othello"] },
    { root = "examples/hex", extraPaths = ["examples/hex"] },
    { root = "examples/connect_four", extraPaths = ["examples/connect_four"] },
    # tests of the Othello example's modules import them as its scripts do
    { root = "tests", extraPaths = ["examples/othello"] },
]

[tool.ruff]
# `ruff check` uses ruff's default rule set (no select/ignore); `ruff format` uses its defaults (line length 88)

[dependency-groups]
dev = [
    # environments + pretrained baselines used by the examples (pgx's baseline models need haiku)
    "dm-haiku>=0.0.17",
    "pgx>=2.6.0",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# summarise xfails/xpasses/skips at the end of the run; run the tests in parallel, on up
# to 8 processes (`-n0` runs them in this one, e.g. to debug with --pdb)
addopts = "-ra -n auto --maxprocesses 8 --dist worksteal"
xfail_strict = true

[tool.uv.sources]
seaglass = { git = "https://github.com/jcbmrshll/seaglass", rev = "v0.3.0" }
