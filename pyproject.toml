[project]
name = "turbozero"
version = "0.1.1"
description = "vectorized alphazero/mcts in JAX"
authors = [{ name = "jcbmrshll", email = "92640744+jcbmrshll@users.noreply.github.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "equinox>=0.13.8",
    "jax>=0.11.2",
    "optax>=0.2.8",
]

[project.optional-dependencies]
# GPU build of jax; ./install.sh adds this when it finds an NVIDIA GPU
cuda = ["jax[cuda13]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turbozero"]

[tool.pyright]
include = ["turbozero", "tests"]
# for editors that run pyright outside `uv run`
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra summarises xfails and skips; -n0 runs in one process, e.g. for --pdb
addopts = "-ra -n auto --maxprocesses 8 --dist worksteal"
xfail_strict = true
