[project]
name = "turbozero"
version = "0.1.1"
description = "vectorized alphazero/mcts in JAX"
authors = [{ name = "jcbmrshll", email = "92640744+jcbmrshll@users.noreply.github.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cairosvg>=2.9.1",
    "flax>=0.12.10",
    "graphviz>=0.21",
    "jax>=0.11.2",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.7",
    "pillow>=12.3.0",
    "wandb>=0.30.0",
]

[project.optional-dependencies]
# GPU build of jax; ./install.sh adds this when it finds an NVIDIA GPU
cuda = ["jax[cuda13]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    # environments + pretrained baselines used by the examples (pgx's baseline models need haiku)
    "dm-haiku>=0.0.17",
    "pgx>=2.6.0",
]
