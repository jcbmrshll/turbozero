name: tests

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # CPU build of jax: the runners have no GPU
      - run: uv sync --locked
      # programs compiled by earlier runs (see tests/conftest.py)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/turbozero/jax-tests
          key: jax-tests-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: jax-tests-${{ hashFiles('uv.lock') }}-
      - run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
