<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #fafafa; color: #1d1d1f; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px 24px; }
  header { display: flex; align-items: baseline; gap: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h1 a { color: inherit; text-decoration: none; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .muted { color: #6e6e73; }
  .cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; align-items: start; }
  @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { padding: 3px 8px; border-bottom: 1px solid #ececec; text-align: right; white-space: nowrap; }
  th { position: sticky; top: 0; background: #f2f2f2; font-weight: 600; cursor: pointer; user-select: none; }
  td.name, th.name { text-align: left; white-space: normal; word-break: break-all; }
  tr.retired td { color: #8e8e93; }
  a { color: #0b57d0; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .win { color: #137333; } .loss { color: #b3261e; }
  input { font: inherit; padding: 3px 6px; width: 260px; }
  .stats { display: flex; gap: 24px; margin: 0 0 16px; }
  .stats div b { display: block; font-size: 18px; }
</style>
</head>
<body>
<main>
  <header><h1><a href="#">League</a></h1><span id="totals" class="muted"></span></header>
  <div id="view"></div>
</main>
<script>
const view = document.getElementById("view");
const totals = document.getElementById("totals");

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const elo = (x) => x.toFixed(0);
const pct = (x) => (x === null ? "" : (100 * x).toFixed(1) + "%");
const playerLink = (id, name) => `<a href="#player/${id}">${esc(name)}</a>`;
const ago = (t) => {
  const s = Date.now() / 1000 - t;
  if (s < 90) return `${Math.round(s)} s ago`;
  if (s < 5400) return `${Math.round(s / 60)} min ago`;
  if (s < 129600) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} d ago`;
};

async function get(path) {
  const response = await fetch(path);
  if (!response.ok) throw new Error((await response.json()).error || response.statusText);
  return response.json();
}

// a table whose columns sort when their header is clicked
function table(columns, rows, sort) {
  const el = document.createElement("table");
  let key = sort.key, dir = sort.dir;
  const draw = () => {
    const col = columns.find((c) => c.key === key);
    const sorted = [...rows].sort((a, b) => {
      const x = col.value(a), y = col.value(b);
      return (x < y ? -1 : x > y ? 1 : 0) * dir;
    });
    el.innerHTML =
      "<thead><tr>" +
      columns.map((c) => `<th class="${c.cls || ""}" data-key="${c.key}">${c.label}${c.key === key ? (dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("") +
      "</tr></thead><tbody>" +
      sorted.map((r, i) => `<tr class="${r.retired ? "retired" : ""}">` +
        columns.map((c) => `<td class="${c.cls || ""}">${c.cell(r, i)}</td>`).join("") + "</tr>").join("") +
      "</tbody>";
  };
  el.addEventListener("click", (e) => {
    const th = e.target.closest("th");
    if (!th) return;
    if (th.dataset.key === key) dir = -dir;
    else { key = th.dataset.key; dir = columns.find((c) => c.key === key).dir || -1; }
    draw();
  });
  draw();
  return el;
}

const record = (r) => `<span class="win">${r.wins}</span>-${r.draws}-<span class="loss">${r.losses}</span>`;

function playerColumns(rank) {
  return [
    ...(rank ? [{ key: "rank", label: "#", value: (r) => -r.elo, cell: (r, i) => i + 1, dir: 1 }] : []),
    { key: "name", label: "Player", cls: "name", value: (r) => r.name, cell: (r) => playerLink(r.id, r.name), dir: 1 },
    { key: "elo", label: "Elo", value: (r) => r.elo, cell: (r) => elo(r.elo) },
    { key: "sd", label: "±", value: (r) => r.sd, cell: (r) => r.sd.toFixed(0), dir: 1 },
    { key: "games", label: "Games", value: (r) => r.games, cell: (r) => r.games },
    { key: "record", label: "W-D-L", value: (r) => r.wins - r.losses, cell: record },
    { key: "score", label: "Score", value: (r) => r.score ?? -1, cell: (r) => pct(r.score) },
  ];
}

function resultCell(g) {
  const score = g.first_score === null ? "" : ` ${g.first_score}-${g.second_score}`;
  return (g.result > 0 ? "1-0" : g.result < 0 ? "0-1" : "½-½") + score;
}

async function showLeague() {
  const s = await get("/api/summary");
  s.players = s.players.filter((p) => p.games > 0);
  document.title = `${s.game} league`;
  totals.textContent = `${s.game} · ${s.players.length} players · ${s.games.toLocaleString()} games`;

  const filter = document.createElement("input");
  filter.placeholder = "filter";
  filter.value = sessionStorage.getItem("filter") || "";
  const holder = document.createElement("div");
  const drawPlayers = () => {
    sessionStorage.setItem("filter", filter.value);
    const terms = filter.value.toLowerCase().split(/\s+/).filter(Boolean);
    const rows = s.players.filter((p) => terms.every((t) => p.name.toLowerCase().includes(t)));
    holder.replaceChildren(table(playerColumns(true), rows, { key: "elo", dir: -1 }));
  };
  filter.addEventListener("input", drawPlayers);
  drawPlayers();

  const recent = table(
    [
      { key: "finished", label: "When", value: (g) => g.id, cell: (g) => `<span title="${new Date(g.finished * 1000).toLocaleString()}">${ago(g.finished)}</span>` },
      { key: "first", label: "First", cls: "name", value: (g) => g.first_name, cell: (g) => playerLink(g.first, g.first_name), dir: 1 },
      { key: "second", label: "Second", cls: "name", value: (g) => g.second_name, cell: (g) => playerLink(g.second, g.second_name), dir: 1 },
      { key: "result", label: "Result", value: (g) => g.result, cell: resultCell },
    ],
    s.recent,
    { key: "finished", dir: -1 },
  );

  const left = document.createElement("section");
  left.innerHTML = "<h2>Players</h2>";
  left.append(filter, holder);
  const right = document.createElement("section");
  right.innerHTML = "<h2>Recent games</h2>";
  right.append(recent);
  const cols = document.createElement("div");
  cols.className = "cols";
  cols.append(left, right);
  view.replaceChildren(cols);
}

async function showPlayer(id) {
  const { player: p, opponents } = await get(`/api/player?id=${id}`);
  document.title = p.name;
  view.innerHTML = `
    <h2>${esc(p.name)}${p.retired ? ' <span class="muted">(paused)</span>' : ""}</h2>
    <div class="stats">
      <div><span class="muted">Elo</span><b>${elo(p.elo)} ± ${p.sd.toFixed(0)}</b></div>
      <div><span class="muted">Games</span><b>${p.games}</b></div>
      <div><span class="muted">W-D-L</span><b>${record(p)}</b></div>
      <div><span class="muted">Score</span><b>${pct(p.score)}</b></div>
      <div><span class="muted">Opponents</span><b>${opponents.length}</b></div>
    </div>`;
  const columns = playerColumns(false);
  columns.splice(3, 0, { key: "diff", label: "Diff", value: (r) => r.elo - p.elo, cell: (r) => `${r.elo >= p.elo ? "+" : ""}${elo(r.elo - p.elo)} ± ${r.diff_sd.toFixed(0)}` });
  columns[0].label = "Opponent";
  view.append(table(columns, opponents, { key: "games", dir: -1 }));
}

async function route() {
  const match = location.hash.match(/^#player\/(\d+)$/);
  try {
    if (match) await showPlayer(match[1]);
    else await showLeague();
  } catch (e) {
    view.textContent = String(e.message || e);
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
